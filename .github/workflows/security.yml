name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  security-check:
    name: Local Security Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Semgrep (deep static scan)
        run: python3 -m pip install --quiet semgrep

      - name: Run security suite (audit + semgrep + static scan)
        run: npm run security-check

      - name: Upload scan report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-logs
          path: |
            npm-debug.log*
            .semgrep/
          if-no-files-found: ignore
          retention-days: 14